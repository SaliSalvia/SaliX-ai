name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle 9.3.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Prepare Keystore and Environment
      run: |
        if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        fi
        if [ -f ".env.example" ] && [ ! -f ".env" ]; then
          cp .env.example .env
        fi
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
        fi

    - name: Build Debug APK with Gradle
      run: |
        gradle :app:assembleDebug --no-build-cache --no-configuration-cache --no-daemon --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: SalviaAIZ-debug-apk
        path: app/build/outputs/apk/debug/*.apk
