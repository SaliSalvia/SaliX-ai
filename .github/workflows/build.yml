name: Build SalviaAI Android APK

on:
  push:
    branches: [ "main", "master", "work" ]
  pull_request:
    branches: [ "main", "master", "work" ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble and lint debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle 8.14.4
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.14.4'

    - name: Install Android SDK packages
      run: |
        sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

    - name: Prepare environment
      run: |
        if [ -f ".env.example" ] && [ ! -f ".env" ]; then
          cp .env.example .env
        fi

    - name: Build debug APK
      run: |
        gradle :app:assembleDebug --no-build-cache --no-configuration-cache --no-daemon --stacktrace

    - name: Run Android lint
      run: |
        gradle :app:lintDebug --no-build-cache --no-configuration-cache --no-daemon --stacktrace

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: SalviaAI-debug-apk
        path: app/build/outputs/apk/debug/*.apk
